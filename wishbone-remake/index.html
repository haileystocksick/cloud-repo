<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wishbone</title>
<style>
:root{
  --bg:#fdeef0; --card:#fff8f6; --ink:#4a2f22; --mut:#a08070;
  --brown:#8a5a3b; --brown-d:#6b4229; --pink:#f6c1cc; --pink-d:#e993a6; --bd:#f2d3d8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;max-width:560px;margin:0 auto}
.logo{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:26px;color:var(--brown);letter-spacing:-.5px}
.logo span{color:var(--pink-d)}
nav{display:flex;gap:6px}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--brown);padding:7px 14px;border-radius:99px;font:600 13px inherit;cursor:pointer}
nav button.on{background:var(--brown);color:#fff8f6;border-color:var(--brown)}
main{max-width:560px;margin:0 auto;padding:0 18px 40px}
.tag{display:block;text-align:center;color:var(--mut);font-size:12px;margin-bottom:4px;text-transform:uppercase;letter-spacing:1.5px}
.q{font-family:Georgia,serif;font-weight:700;font-size:22px;text-align:center;margin:6px 0 14px;color:var(--brown-d)}
.by{text-align:center;color:var(--mut);font-size:13px;margin:-8px 0 14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;aspect-ratio:3/4;border:0;border-radius:22px;overflow:hidden;cursor:pointer;color:#fff;background:var(--pink) center/cover no-repeat;box-shadow:0 6px 16px rgba(138,90,59,.18);transition:transform .15s}
.opt:active{transform:scale(.97)}
.opt::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(74,47,34,.75),rgba(74,47,34,0) 55%)}
.opt .fill{position:absolute;inset:auto 0 0 0;height:0;background:rgba(138,90,59,.45);transition:height .7s ease}
.opt .lb{position:absolute;left:10px;right:10px;bottom:12px;font-weight:700;font-size:18px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.opt .pct{position:absolute;top:14px;left:0;right:0;font-size:36px;font-weight:800;opacity:0;transition:opacity .4s .3s;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.revealed .pct{opacity:1}
.revealed .opt:not(.picked){filter:saturate(.55) brightness(.9)}
.opt.picked{outline:4px solid var(--pink-d);outline-offset:-4px}
.opt.picked .lb::after{content:" ✓"}
.meta{text-align:center;color:var(--mut);font-size:13px;margin:14px 0}
.big{display:block;width:100%;border:0;background:var(--brown);color:#fff8f6;font:700 16px inherit;padding:14px;border-radius:14px;cursor:pointer;margin-top:6px}
.big:hover{background:var(--brown-d)}
.big[disabled]{opacity:.35;cursor:default}
.big.pink{background:var(--pink);color:var(--brown-d)}
.big.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--ink);font:15px inherit}
input:focus{outline:2px solid var(--pink-d);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{aspect-ratio:3/4;border:2px dashed var(--pink-d);border-radius:16px;background:#fff center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--pink-d);font-weight:700;cursor:pointer;font-size:14px;padding:8px}
.drop.has{border-style:solid;color:transparent}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.thumbs{display:flex;gap:8px;margin:10px 0 4px}
.thumbs div{flex:1;aspect-ratio:3/4;max-height:120px;border-radius:12px;background:center/cover;position:relative}
.thumbs b{position:absolute;left:0;right:0;bottom:0;font-size:12px;color:#fff;text-align:center;padding:3px;background:rgba(74,47,34,.55);border-radius:0 0 12px 12px}
.bar{height:8px;border-radius:99px;overflow:hidden;display:flex;margin-top:8px;background:var(--bd)}
.stat{font-family:Georgia,serif;font-size:30px;font-weight:700;color:var(--brown)}
.err{color:#b4384f;font-size:13px;margin-top:8px;min-height:18px}
.link{background:none;border:0;color:var(--brown);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.hide{display:none}
</style>
</head>
<body>
<header>
  <div class="logo">wish<span>bone</span></div>
  <nav id="nav" class="hide">
    <button id="n-vote" class="on">Vote</button><button id="n-make">Ask</button><button id="n-mine">Mine</button>
  </nav>
</header>
<main>
  <section id="auth" class="hide">
    <div class="card">
      <div class="q" id="auth-title" style="margin-top:0">Welcome back</div>
      <label>Username</label><input type="text" id="au" autocomplete="username" maxlength="20">
      <label>Password</label><input type="password" id="ap" autocomplete="current-password">
      <div class="err" id="auth-err"></div>
      <button class="big" id="auth-go">Log in</button>
      <p class="meta" style="margin-bottom:0"><span id="auth-sw-txt">New here?</span> <button class="link" id="auth-sw">Create an account</button></p>
    </div>
  </section>
  <section id="vote" class="hide"></section>
  <section id="make" class="hide">
    <div class="card">
      <label style="margin-top:0">Your question</label>
      <input type="text" id="mq" maxlength="80" placeholder="Which would you rather?">
      <div class="row">
        <div><label>Option A</label><div class="drop" id="da">+ Add photo</div><input type="file" id="fa" accept="image/*" class="hide"><input type="text" id="la" maxlength="24" placeholder="Label" style="margin-top:8px"></div>
        <div><label>Option B</label><div class="drop" id="db">+ Add photo</div><input type="file" id="fb" accept="image/*" class="hide"><input type="text" id="lb" maxlength="24" placeholder="Label" style="margin-top:8px"></div>
      </div>
      <div class="err" id="make-err"></div>
      <button class="big" id="post">Post it</button>
    </div>
  </section>
  <section id="mine" class="hide"></section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me = null, feed = [], justVoted = null, authMode = "login";

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, { credentials: "same-origin", ...opts });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && me) { me = null; showAuth(); }
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

/* ---------- auth ---------- */
function showAuth() {
  $("nav").classList.add("hide");
  ["vote","make","mine"].forEach(x => $(x).classList.add("hide"));
  $("auth").classList.remove("hide");
}
function setMode(m) {
  authMode = m;
  const login = m === "login";
  $("auth-title").textContent = login ? "Welcome back" : "Make an account";
  $("auth-go").textContent = login ? "Log in" : "Sign up";
  $("auth-sw-txt").textContent = login ? "New here?" : "Already have one?";
  $("auth-sw").textContent = login ? "Create an account" : "Log in";
  $("ap").autocomplete = login ? "current-password" : "new-password";
  $("auth-err").textContent = "";
}
$("auth-sw").onclick = () => setMode(authMode === "login" ? "register" : "login");
async function submitAuth() {
  try {
    const j = await post(authMode === "login" ? "/login" : "/register", { username: $("au").value, password: $("ap").value });
    me = j.user; $("ap").value = ""; enter();
  } catch (e) { $("auth-err").textContent = e.message; }
}
$("auth-go").onclick = submitAuth;
$("ap").onkeydown = e => { if (e.key === "Enter") submitAuth(); };
function enter() { $("auth").classList.add("hide"); $("nav").classList.remove("hide"); tab("vote"); }

/* ---------- tabs ---------- */
function tab(t) {
  ["vote","make","mine"].forEach(x => { $(x).classList.toggle("hide", x !== t); $("n-" + x).classList.toggle("on", x === t); });
  if (t === "vote") renderVote();
  if (t === "mine") renderMine();
}
["vote","make","mine"].forEach(t => $("n-" + t).onclick = () => tab(t));

/* ---------- vote ---------- */
const pct = (p, k) => { const t = p.a.votes + p.b.votes || 1; return Math.round(p[k].votes / t * 100); };
function opt(p, k, reveal) {
  return `<button class="opt ${p.my_vote === k ? "picked" : ""}" data-k="${k}" style="background-image:url('${esc(p[k].image)}')">
    <span class="pct">${reveal ? pct(p, k) + "%" : ""}</span>
    <div class="fill" style="${reveal ? "height:" + pct(p, k) + "%" : ""}"></div>
    <span class="lb">${esc(p[k].label)}</span></button>`;
}
async function renderVote() {
  const el = $("vote");
  if (!justVoted) {
    try { feed = (await api("/polls")).polls; }
    catch (e) { el.innerHTML = `<div class="card meta">${esc(e.message)}</div>`; return; }
  }
  const p = justVoted ? feed.find(x => x.id === justVoted) : feed.find(x => !x.my_vote);
  if (!p) {
    el.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:44px">🌸</div><b>You're all caught up!</b>
      <p class="meta">Ask something new and see what everyone thinks.</p><button class="big" id="go-ask">Ask a question</button></div>`;
    $("go-ask").onclick = () => tab("make"); return;
  }
  const rev = !!p.my_vote;
  el.innerHTML = `<span class="tag">this or that</span><div class="q">${esc(p.question)}</div><div class="by">by @${esc(p.author)}</div>
    <div class="pair ${rev ? "revealed" : ""}" id="pair">${opt(p, "a", rev)}${opt(p, "b", rev)}</div>
    <div class="meta" id="count">${rev ? (p.a.votes + p.b.votes).toLocaleString() + " votes" : "Tap a picture to vote"}</div>
    <button class="big" id="next" ${rev ? "" : "disabled"}>Next →</button>`;
  if (!rev) el.querySelectorAll(".opt").forEach(b => b.onclick = () => vote(p, b.dataset.k));
  $("next").onclick = () => { justVoted = null; renderVote(); };
}
async function vote(p, k) {
  try {
    const u = (await post(`/polls/${p.id}/vote`, { side: k })).poll;
    feed = feed.map(x => x.id === u.id ? u : x); justVoted = u.id;
    const pair = $("pair"); pair.classList.add("revealed");
    pair.querySelectorAll(".opt").forEach(b => {
      b.onclick = null; b.classList.toggle("picked", b.dataset.k === k);
      b.querySelector(".pct").textContent = pct(u, b.dataset.k) + "%";
      requestAnimationFrame(() => b.querySelector(".fill").style.height = pct(u, b.dataset.k) + "%");
    });
    $("count").textContent = (u.a.votes + u.b.votes).toLocaleString() + " votes";
    $("next").disabled = false;
  } catch (e) { $("count").textContent = e.message; }
}

/* ---------- ask ---------- */
function wirePicker(drop, input) {
  drop.onclick = () => input.click();
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    drop.style.backgroundImage = `url('${URL.createObjectURL(f)}')`; drop.classList.add("has");
  };
}
wirePicker($("da"), $("fa")); wirePicker($("db"), $("fb"));
$("post").onclick = async () => {
  const fd = new FormData();
  fd.append("question", $("mq").value); fd.append("a_label", $("la").value); fd.append("b_label", $("lb").value);
  if ($("fa").files[0]) fd.append("a_image", $("fa").files[0]);
  if ($("fb").files[0]) fd.append("b_image", $("fb").files[0]);
  $("post").disabled = true; $("make-err").textContent = "";
  try {
    await api("/polls", { method: "POST", body: fd });
    ["mq","la","lb","fa","fb"].forEach(i => $(i).value = "");
    ["da","db"].forEach(i => { $(i).style.backgroundImage = ""; $(i).classList.remove("has"); });
    me = (await api("/me")).user; tab("mine");
  } catch (e) { $("make-err").textContent = e.message; }
  $("post").disabled = false;
};

/* ---------- mine ---------- */
async function renderMine() {
  const el = $("mine");
  let polls;
  try { me = (await api("/me")).user; polls = (await api("/polls?scope=mine")).polls; }
  catch (e) { el.innerHTML = `<div class="card meta">${esc(e.message)}</div>`; return; }
  let h = `<div class="card"><div class="row"><div><div class="stat">${me.polls_made}</div><div class="meta" style="margin:0;text-align:left">polls asked</div></div>
    <div><div class="stat">${me.votes_cast}</div><div class="meta" style="margin:0;text-align:left">votes cast</div></div></div></div>`;
  h += polls.length ? polls.map(p => {
    const pa = pct(p, "a"), n = p.a.votes + p.b.votes;
    return `<div class="card"><div class="item"><b>${esc(p.question)}</b><span class="meta" style="margin:0">${n} vote${n === 1 ? "" : "s"}</span></div>
      <div class="thumbs"><div style="background-image:url('${esc(p.a.image)}')"><b>${esc(p.a.label)} ${n ? pa + "%" : ""}</b></div>
      <div style="background-image:url('${esc(p.b.image)}')"><b>${esc(p.b.label)} ${n ? 100 - pa + "%" : ""}</b></div></div>
      <div class="bar"><div style="width:${n ? pa : 50}%;background:var(--brown)"></div><div style="flex:1;background:var(--pink-d)"></div></div>
      <button class="link" data-del="${p.id}" style="margin-top:10px;font-size:13px;color:var(--mut)">Delete</button></div>`;
  }).join("") : `<p class="meta">You haven't asked anything yet.</p>`;
  h += `<button class="big ghost" id="logout">Log out (@${esc(me.username)})</button>`;
  el.innerHTML = h;
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (confirm("Delete this poll and its votes?")) { await api("/polls/" + b.dataset.del, { method: "DELETE" }); renderMine(); }
  });
  $("logout").onclick = async () => { await post("/logout", {}); me = null; justVoted = null; showAuth(); };
}

/* ---------- start ---------- */
(async () => {
  try { me = (await api("/me")).user; } catch (e) {}
  me ? enter() : showAuth();
})();
</script>
</body>
</html>
